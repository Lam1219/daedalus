# Generate Daedalus.xcodeproj with XcodeGen:  cd daedalus-companion-ios && xcodegen
name: Daedalus
options:
  bundleIdPrefix: com.medicina
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

settings:
  base:
    # Signing team for device builds (kept here so regenerating the project doesn't drop it).
    DEVELOPMENT_TEAM: SFQ29D84T9
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Daedalus:
    type: application
    platform: iOS
    sources:
      - path: Daedalus
      - path: Shared
    dependencies:
      - package: Supabase
      # The Apple Watch app ships inside the iPhone app.
      - target: DaedalusWatch
    entitlements:
      path: Daedalus/Resources/Daedalus.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Daedalus/Resources/Info.plist
      properties:
        CFBundleDisplayName: Daedalus
        UIUserInterfaceStyle: Light
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - manrope_regular.ttf
          - manrope_medium.ttf
          - manrope_semibold.ttf
          - manrope_bold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.medicina.daedaluscompanion.auth
            CFBundleURLSchemes: [daedalus]
        NSHealthShareUsageDescription: Daedalus reads your heart rate, blood oxygen and breathing rate from Apple Health to show your latest vital signs.
        NSHealthUpdateUsageDescription: Daedalus does not write to Apple Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medicina.daedaluscompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Keys are managed by tools/make_strings.py; stop Xcode adding extracted entries.
        SWIFT_EMIT_LOC_STRINGS: NO
    preBuildScripts:
      - name: Supabase settings
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Daedalus/App/SupabaseConfig.generated.swift
        script: |
          # Writes the Supabase URL and anon key (shared with the Android app's
          # supabase.properties, not committed) into a generated, git-ignored Swift file.
          "${SRCROOT}/tools/supabase_config.sh"

  DaedalusWatch:
    type: application
    platform: watchOS
    sources:
      - path: DaedalusWatch
      - path: Shared
    entitlements:
      path: DaedalusWatch/Resources/DaedalusWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: DaedalusWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Daedalus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.medicina.daedaluscompanion
        WKRunsIndependentlyOfCompanionApp: false
        # Cues run inside a workout session, so they keep going with the wrist down.
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Daedalus reads your heart rate during a cue session to record it with the session.
        NSHealthUpdateUsageDescription: Daedalus runs cue sessions as workouts so they keep going with your wrist down. Nothing is saved to Apple Health.
        NSMotionUsageDescription: Daedalus records wrist movement during a cue session, for your session file.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medicina.daedaluscompanion.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SKIP_INSTALL: YES
